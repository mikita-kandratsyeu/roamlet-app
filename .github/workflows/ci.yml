name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, TypeScript and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-node26-yarn-${{ hashFiles('yarn.lock', '.yarnrc.yml', '.yarn/releases/yarn-4.18.1.cjs', 'package.json', 'client/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node26-yarn-
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Cache ESLint results
        uses: actions/cache@v4
        with:
          path: .yarn/ci-eslint.cache
          key: ${{ runner.os }}-node26-eslint-${{ hashFiles('yarn.lock', 'eslint.config.js', 'package.json', 'client/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node26-eslint-${{ hashFiles('yarn.lock', 'eslint.config.js', 'package.json', 'client/package.json') }}-
      - name: Lint, TypeScript and unit tests
        run: node .yarn/releases/yarn-4.18.1.cjs check:ci
